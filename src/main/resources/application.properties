spring.application.name=eventhub-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:eventhub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080